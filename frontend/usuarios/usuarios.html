<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar usuarios</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/usuarios.css">
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">
            <img src="../img/logo.png" class="logo-img">
            <span>Urbaniza</span>
        </div>

        <div class="menu-icon" onclick="toggleMenu()">☰</div>
    </div>

    <!-- MENÚ -->
    <div id="menu" class="menu hidden">

        <!-- INSTALACIONES -->
        <div class="menu-section">
            <p>Instalaciones</p>

            <div class="menu-section">
                <button onclick="irInicio()">Inicio</button>

                <!-- Instalaciones dinámicas -->
                <div id="listaInstalaciones"></div>
            </div>
        </div>

        <!-- USUARIO -->
        <div class="menu-section">
            <p onclick="toggleUserMenu()" style="cursor:pointer;">
                Usuario ▼
            </p>

            <div id="userSubmenu" class="hidden">
                <button onclick="irDatos()">Datos de acceso</button>
                <button onclick="logout()">Cerrar sesión</button>
            </div>
        </div>

    </div>

    <!-- CONTENIDO -->
    <div class="panel-container">

        <h1>Usuarios registrados</h1>

        <table id="tablaUsuarios">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Rol</th>
                    <th>Acción</th>
                </tr>
            </thead>

            <tbody id="usuariosBody"></tbody>

        </table>

    </div>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Urbaniza</p>

        <div class="links">
            <a href="../info/quienes.html">¿Quiénes somos?</a>
            <a href="../info/privacidad.html">Política de privacidad</a>
            <a href="../info/legal.html">Aviso legal</a>
        </div>
    </footer>

    <script src="../config.js"></script>
    <script src="usuarios.js"></script>

</body>
</html>
