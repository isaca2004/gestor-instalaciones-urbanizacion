<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear instalación</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/formadmin.css">
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">
            <img src="../img/logo.png" class="logo-img">
            <span>Urbaniza</span>
        </div>

        <div class="menu-icon" onclick="toggleMenu()">☰</div>
    </div>

    <!-- MENÚ -->
    <div id="menu" class="menu hidden">

        <div class="menu-section">
            <button onclick="irInicio()">Inicio</button>

            <!--Instalaciones dinamicas-->
            <div id="listaInstalaciones"></div>
        </div>

        <div class="menu-section">
            <button onclick="logout()">Cerrar sesión</button>
        </div>

    </div>

    <!-- CONTENIDO -->
    <div class="form-container">

        <h1>Crear instalación</h1>

        <input type="text" id="nombre" placeholder="Nombre instalación">

        <button class="btn-confirm" onclick="crearInstalacion()">
            Crear instalación
        </button>

    </div>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Urbaniza</p>

        <div class="links">
            <a href="../info/quienes.html">¿Quiénes somos?</a>
            <a href="../info/privacidad.html">Política de privacidad</a>
            <a href="../info/legal.html">Aviso legal</a>
        </div>
    </footer>

    <script src="../config.js"></script>
    <script src="crearinstalacion.js"></script>

</body>
</html>
