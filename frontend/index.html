<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">
        <img src="img/logo.png" class="logo-img">
        <span>Urbaniza</span>
    </div>

    <div class="menu-icon" onclick="toggleMenu()">☰</div>
</div>

<!-- MENÚ -->
<div id="menu" class="menu hidden">

    <!-- INSTALACIONES -->
    <div class="menu-section">
        <p>Instalaciones</p>
       <div class="menu-section">
            <button onclick="irInicio()">Inicio</button>
             <!--Instalaciones dinamicas-->
            <div id="listaInstalaciones"></div>
        </div>
    </div>

    <!-- USUARIO -->
    <div class="menu-section">
        <p onclick="toggleUserMenu()" style="cursor:pointer;">Usuario ▼</p>

        <div id="userSubmenu" class="hidden">
            <button onclick="irDatos()">Datos de acceso</button>
            <button onclick="logout()">Cerrar sesión</button>
        </div>
    </div>

</div>

<!-- CONTENIDO -->
<div class="panel-container" id="panelCards">

    <!-- RESERVAS ACTIVAS -->
    <div class="card" id="btnReservas">
        <h2>Mis reservas</h2>
    </div>

    <!-- Botón dinámico -->
    <div class="card" id="btnSecundario">
        <h2 id="tituloSecundario"></h2>
    </div>
    <!--SOLO para el admin-->
    <div class="card hidden" id="btnInvitaciones">
        <h2>Invitaciones</h2>
    </div>
</div>
<!--Footer-->
<footer>
    <p>© 2026 Urbaniza</p>

    <div class="links">
        <a href="info/quienes.html">¿Quiénes somos?</a>
        <a href="info/privacidad.html">Política de privacidad</a>
        <a href="info/legal.html">Aviso legal</a>
    </div>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
