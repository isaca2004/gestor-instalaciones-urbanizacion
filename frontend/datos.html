<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos de acceso</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/datos.css">
</head>
<body>
    <!--Navbar-->
    <div class="navbar">
        <div class="logo">
            <img src="img/logo.png" class="logo-img">
            <span>Urbaniza</span>
        </div>

        <div class="menu-icon" onclick="toggleMenu()">☰</div>
    </div>

    <!--Menu-->
    <div id="menu" class="menu hidden">
        <div class="menu-section">
            <button onclick="irInicio()">Inicio</button>
             <!--Instalaciones dinamicas-->
            <div id="listaInstalaciones"></div>
        </div>

        <div class="menu-section">
            <button onclick="logout()">
                Cerrar sesión
            </button>
        </div>
    </div>

    <!--Contenido-->
    <div class="container">
        <h1>Datos de acceso</h1>

        <p class="descripcion">
            Para modificar tu contrasena en <b>Urbaniza</b>, introduce tu contraseña actual,
            después una nueva contraseña segura y confírmala.
        </p>

        <label>Nombre de usuario</label>
        <p id="username"></p>

        <label>Contraseña actual</label>
        <input type="password" id="oldPassword">

        <label>Nueva contraseña</label>
        <input type="password" id="newPassword">

        <label>Repite la nueva contraseña</label>
        <input type="password" id="repeatPassword">

        <button class="btn-confirm" onclick="cambiarContrasena()">
            Modificar datos de acceso
        </button>
    </div>

    <!--Footer-->
    <footer>
        <p>© 2026 Urbaniza</p>

        <div class="links">
            <a href="info/quienes.html">¿Quiénes somos?</a>
            <a href="info/privacidad.html">Política de privacidad</a>
            <a href="info/legal.html">Aviso legal</a>
        </div>
    </footer>
    <script src="config.js"></script>
    <script src="datos.js"></script>
</body>
</html>
