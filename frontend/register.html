<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Crear cuenta</h1>

            <p id="estado">Validando invitación...</p>

            <div id="formulario" class="hidden">
                <input type="text" id="bloque" placeholder="Bloque">
                <input type="number" id="escalera" placeholder="Escalera" min="1">
                <input type="number" id="piso" placeholder="Piso" min="1">
                <input type="text" id="letra" placeholder="Letra">
                <input type="password" id="password" placeholder="Contraseña">

                <button onclick="registrarse()">Crear cuenta</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="registro.js"></script>
</body>
</html>
