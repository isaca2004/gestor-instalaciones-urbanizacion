<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <!--HEADER-->
    <div class="header">
        <img src="img/logo.png" class="logo-img">

        <div class="logo-text">
            <h1>Urbaniza</h1>
            <p>Gestión de reservas</p>
        </div>
    </div>
   <!--LOGIN-->
   <div class="login-container">
    <div class="login-card">
        <div class="avatar">👤</div>

        <h2>Iniciar sesión</h2>
        <p class="subtitle">Accede a tu cuenta para continuar</p>

        <input type="text" id="username" class="form-control mb-3" placeholder="Usuario">
        <input type="password" id="password" class="form-control mb-3" placeholder="Contraseña">
        
        <button class="btn btn-success w-100" onclick="login()">Conectar</button>
    </div>
   </div>

   <!--FOOTER-->
   <footer>
    <p>© 2026 Urbaniza</p>
    <div class="links">
        <a href="info/quienes.html">¿Quiénes somos?</a>
        <a href="info/privacidad.html">Política de privacidad</a>
        <a href="info/legal.html">Aviso legal</a>
    </div>
   </footer>

    <script src="config.js"></script>
    <script src="login.js"></script>
</body>
</html>
